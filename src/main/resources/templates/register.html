<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - TrackerGym</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <img th:src="@{/img/logosvg.svg}" alt="TrackerGym Logos" class="logo-img">
            <p>Crea tu cuenta</p>
        </div>

        <div th:if="${param.error}" class="alert alert-error">
            <span th:text="${param.error}">Error</span>
        </div>

        <div th:if="${param.success}" class="alert alert-success">
            Usuario registrado exitosamente. Por favor inicia sesión.
        </div>

        <form th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required placeholder="Nombre de usuario">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="Contraseña">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                    placeholder="Repite la contraseña">
            </div>

            <div class="form-group">
                <label for="role">Tipo de Usuario</label>
                <select id="role" name="role" required>
                    <option value="">-- Selecciona --</option>
                    <option value="ROLE_USER">Cliente</option>
                    <option value="ROLE_ADMIN">Entrenador</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
        </form>

        <div class="auth-footer">
            ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
        </div>
    </div>
</body>

</html>

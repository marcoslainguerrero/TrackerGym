<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TrackerGym</title>
    <link rel="stylesheet" th:href="@{/css/landing.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body class="auth-page">

    <!-- ===== NAVBAR (same as landing) ===== -->
    <nav class="lp-navbar lp-navbar-auth" id="lp-navbar">
        <a th:href="@{/}" class="lp-brand">
            <span class="lp-brand-name">TrackerGym</span>
        </a>
        <div class="lp-nav-actions">
            <a th:href="@{/}" class="lp-btn-ghost">Volver al Inicio</a>
            <a th:href="@{/register}" class="lp-btn-cta">Registrarse Gratis</a>
        </div>
    </nav>

    <div class="auth-card">
        <div class="auth-logo">
            <img th:src="@{/img/logosvg.svg}" alt="TrackerGym Logos" class="logo-img">
            <p>Gestiona tu entrenamiento</p>
        </div>

        <div th:if="${param.error}" class="alert alert-error">
            Usuario o contraseña incorrectos.
        </div>

        <div th:if="${param.success}" class="alert alert-success">
            ¡Registro exitoso! Inicia sesión con tus credenciales.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Tu nombre de usuario" required
                    autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password" placeholder="Tu contraseña" required
                        autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <img id="toggleIcon" th:src="@{/img/ojocerrado.svg}" alt="Mostrar/Ocultar" class="toggle-icon">
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
        </form>

        <div class="auth-footer">
            ¿No tienes cuenta? <a th:href="@{/register}">Regístrate aquí</a>
        </div>
    </div>

    <script>
        // Alterna la visibilidad de la contraseña en el formulario de login.
        // También cambia el icono según el estado (mostrar/ocultar).
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.src = '/img/ojoabierto.svg';
            } else {
                input.type = 'password';
                icon.src = '/img/ojocerrado.svg';
            }
        }
    </script>
</body>

</html>
